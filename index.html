<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valmed Pharma · İşe Alım</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap">
<style>
:root{--bg:#F4F6F8;--paper:#fff;--ink:#14232C;--muted:#5A6A73;--line:#DCE3E8;--accent:#24557A}
@media (prefers-color-scheme:dark){:root{--bg:#0E151B;--paper:#141E26;--ink:#E2EAF0;--muted:#93A3AE;--line:#27363F;--accent:#7DB3DA;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend","Segoe UI",system-ui,sans-serif;font-weight:300;line-height:1.6;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:32px;max-width:520px;display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--paper);font-size:14px;font-weight:500}
h1{font-size:26px;font-weight:500;margin:0;line-height:1.25}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="mark" aria-hidden="true">V</div><span>Valmed Pharma · İnsan Kaynakları</span></div>
  <h1>İşe alım değerlendirmeleri</h1>
  <p>Bu sayfa, Valmed Pharma'ya başvuran adayların değerlendirme testleri içindir.</p>
  <p>Size gönderilen e-postadaki bağlantıyı kullanarak testinize başlayabilirsiniz. Bağlantınız çalışmazsa İnsan Kaynakları ile iletişime geçin.</p>
</main>
</body>
</html>
